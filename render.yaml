# Render Blueprint — one file, whole app.
# Deploy: New → Blueprint → connect this repo → Render provisions everything.
# The web service runs the Dockerfile (backend + frontend, same origin).
# DB + object storage live in Supabase (free, no card, nothing expires);
# every secret is sync:false — paste values in the Render dashboard.

services:
  - type: web
    name: ragchatbot
    runtime: docker
    repo: https://github.com/shubhambhattacharya-dev/RagChatBot
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false                      # paste Supabase connection string (URI)
      - key: REDIS_URL
        value: redis://localhost:6379   # in-container Redis, started by the Dockerfile CMD.
                                        # IMPORTANT: remove any external REDIS_URL override
                                        # (e.g. Upstash) from the Render dashboard — BullMQ's
                                        # worker polling burns Upstash's free 500k req/month
                                        # quota in days (ERR max requests limit exceeded).
      - key: MINIO_ENDPOINT
        sync: false                      # set in dashboard: your S3 URL
                                         # Supabase: https://<ref>.supabase.co/storage/v1/s3
                                         # R2: https://<accountid>.r2.cloudflarestorage.com
      - key: MINIO_ACCESS_KEY
        sync: false                      # Supabase S3 access key
      - key: MINIO_SECRET_KEY
        sync: false                      # Supabase S3 secret key
      - key: MINIO_BUCKET
        value: rag-files
      - key: GROQ_API
        sync: false                      # paste your Groq key
      - key: GEMINI_API
        sync: false                      # paste your Gemini key
      - key: OPENROUTER_API
        sync: false                      # paste your OpenRouter key (env requires it)
      - key: LANGFUSE_PUBLIC_KEY
        sync: false                      # paste your Langfuse public key (pk-lf-...)
      - key: LANGFUSE_SECRET_KEY
        sync: false                      # paste your Langfuse secret key (sk-lf-...)
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com # 🇪🇺 EU region (or https://us.cloud.langfuse.com for 🇺🇸 US)
